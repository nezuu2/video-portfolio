<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Video Collection | Video Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
	<nav class="navbar navbar-expand-lg site-nav" aria-label="メインナビゲーション">
		<div class="container py-3">
			<a class="navbar-brand brand-mark" href="#top">VIDEO / PORTFOLIO</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="メニューを開く">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="mainNav">
				<ul class="navbar-nav ms-auto gap-lg-4 font-monospace small">
					<li class="nav-item"><a class="nav-link" href="#collection">Collection</a></li>
					<li class="nav-item"><a class="nav-link" href="#about">About</a></li>
				</ul>
			</div>
		</div>
	</nav>

	<main id="top">
		<section class="hero">
			<div class="container">
				<div class="row align-items-end g-5">
					<div class="col-lg-8">
						<p class="font-monospace small mb-4">01 / SELECTED WORKS</p>
						<h1 class="mb-0">Moving<br>stories.</h1>
					</div>
					<div class="col-lg-4">
						<p class="hero-copy mb-0">映像で切り取った、場所、人、記憶。これまでに制作した動画をポートフォリオとしてまとめています。</p>
					</div>
				</div>
			</div>
		</section>

		<section id="collection" class="py-5">
			<div class="container">
				<div class="collection-header d-flex flex-wrap justify-content-between align-items-center gap-3 pb-3 mb-4">
					<h2 class="h4 mb-0">All films <span class="font-monospace small text-secondary">(02)</span></h2>
					<div class="d-flex gap-2" role="group" aria-label="作品のカテゴリー">
						<button class="btn filter-button active" type="button" data-filter="all" aria-pressed="true">All</button>
						<button class="btn filter-button" type="button" data-filter="film" aria-pressed="false">Film</button>
						<button class="btn filter-button" type="button" data-filter="motion" aria-pressed="false">Motion</button>
					</div>
				</div>

				<div class="row g-4">
					<div class="col-md-6 col-lg-4" data-category="film">
						<article class="card video-card h-100">
							<video class="video-player" controls preload="metadata">
								<source src="videos/coffee.mp4" type="video/mp4">
								お使いのブラウザは動画再生に対応していません。
							</video>
							<div class="card-body"><p class="video-meta mb-2">01 / Film / 02:14</p><h3 class="mb-0">コーヒー</h3></div>
						</article>
					</div>
					<div class="col-md-6 col-lg-4" data-category="film">
						<article class="card video-card h-100">
							<video class="video-player" controls preload="metadata">
								<source src="videos/personal-computer.mp4" type="video/mp4">
								お使いのブラウザは動画再生に対応していません。
							</video>
							<div class="card-body"><p class="video-meta mb-2">02 / Film / 01:48</p><h3 class="mb-0">ノートパソコンの画面にリモコン</h3></div>
						</article>
					</div>
				</div>
			</div>
		</section>
	</main>

	<script>
		const filterButtons = document.querySelectorAll("[data-filter]");
		const videoItems = document.querySelectorAll("[data-category]");

		filterButtons.forEach((button) => {
			button.addEventListener("click", () => {
				const filter = button.dataset.filter;

				filterButtons.forEach((item) => {
					const isActive = item === button;
					item.classList.toggle("active", isActive);
					item.setAttribute("aria-pressed", isActive);
				});

				videoItems.forEach((item) => {
					item.hidden = filter !== "all" && item.dataset.category !== filter;
				});
			});
		});
	</script>

	<footer id="about" class="py-4">
		<div class="container d-flex flex-wrap justify-content-between gap-2">
			<span>© 2026 Video Portfolio</span>
			<span>Kagoshima / Available for collaborations</span>
		</div>
	</footer>
</body>
</html>
